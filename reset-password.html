<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexuzAI — Set a new password</title>
  <link rel="preconnect" href="https://onanhpeqttqdruruemwr.supabase.co" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .reset-card { max-width: 420px; width: 92%; padding: 2rem; }
    .reset-status { margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="modal-box login-box reset-card">
    <div class="modal-header-wrap">
      <div class="modal-header">
        <span class="modal-icon">🔑</span>
        <div>
          <h3 id="resetTitle">Set a new password</h3>
          <p id="resetDesc">Choose a new password for your NexuzAI account</p>
        </div>
      </div>
    </div>
    <div class="modal-scroll-body">
      <form class="payment-form" id="resetForm" onsubmit="handleResetSubmit(event)">
        <div class="form-row">
          <label>New password</label>
          <input type="password" id="resetPass" placeholder="••••••••" minlength="6" required />
        </div>
        <button type="submit" class="submit-pay-btn" id="resetSubmitBtn">Update password</button>
      </form>
      <p class="reset-status" id="resetStatus"></p>
      <p class="pay-note" style="text-align:center; margin-top:0.75rem">
        <a href="/" style="color:var(--accent)">Back to NexuzAI</a>
      </p>
    </div>
  </div>

  <script src="js/analytics.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    function getSupabase() {
      const cfg = window.NEXUZ_SUPABASE_CONFIG || {};
      if (!cfg.url || !cfg.anonKey || cfg.anonKey.includes('{{')) return null;
      return window.supabase.createClient(cfg.url, cfg.anonKey);
    }

    function setStatus(msg, color) {
      const el = document.getElementById('resetStatus');
      el.textContent = msg;
      el.style.color = color || 'var(--accent)';
    }

    // On load, the URL hash contains the recovery tokens (access_token,
    // refresh_token, type=recovery). Supabase JS automatically picks them up
    // from the current URL, establishing a session in "recovery" mode so
    // updateUser() can set a new password.
    window.addEventListener('DOMContentLoaded', () => {
      const sb = getSupabase();
      if (!sb) {
        setStatus('Configuration error. Please contact support.', '#ef4444');
        return;
      }
      sb.auth.getSession().then(({ data, error }) => {
        if (error || !data.session) {
          setStatus('This reset link is invalid or has expired. Request a new one.', '#ef4444');
          document.getElementById('resetForm').style.display = 'none';
        }
      });
    });

    async function handleResetSubmit(e) {
      e.preventDefault();
      const sb = getSupabase();
      const pass = document.getElementById('resetPass').value;
      const btn = document.getElementById('resetSubmitBtn');
      if (!sb) { setStatus('Configuration error.', '#ef4444'); return; }

      btn.disabled = true;
      btn.textContent = 'Updating...';
      try {
        const { error } = await sb.auth.updateUser({ password: pass });
        if (error) throw error;
        setStatus('✅ Password updated! You can now sign in.', '#4af0c8');
        document.getElementById('resetForm').style.display = 'none';
      } catch (err) {
        setStatus('❌ ' + (err.message || 'Could not update password.'), '#ef4444');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update password';
      }
    }
  </script>
</body>
</html>

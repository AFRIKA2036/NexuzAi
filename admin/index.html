<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexuzAI Admin — Get Started</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/admin/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg-orb"></div>

    <div id="login-overlay" style="display: flex;">
        <div class="portal-card">
            <span class="portal-logo">⬡</span>
            <h2 id="portal-title">Join Admin</h2>
            <p id="auth-status" style="color: #94a3b8; margin-bottom: 2rem;">
                Sign up with Google to request admin access. You must verify your email before signing in.
            </p>

            <div id="auth-actions">
                <button type="button" class="btn-nexus" id="google-login-btn">
                    <span style="display:flex; align-items:center; justify-content:center; gap:0.5rem;">
                        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285f4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34a853"/><path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.712s.102-1.173.282-1.712V4.956H.957a9.006 9.006 0 0 0 0 8.088l3.007-2.332z" fill="#fbbc05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.956l3.007 2.332C4.672 5.164 6.656 3.58 9 3.58z" fill="#ea4335"/></svg>
                        Sign up with Google
                    </span>
                </button>
            </div>

            <div class="portal-switch" style="opacity: 1; margin-top: 1.5rem;">
                <span id="switch-text">Already verified?</span>
                <a href="/admin/signin.html" style="color: var(--accent); text-decoration: underline; margin-left: 0.5rem;">Go to Sign In</a>
            </div>

            <div style="margin-top: 2rem; font-size: 0.8rem;">
                <a href="/" style="color: #64748b; text-decoration: none; border-bottom: 1px solid #334155;">Return to Main Site</a>
            </div>
        </div>
    </div>

    <script src="/js/supabase-service.js"></script>
    <script src="/admin/js/admin.js"></script>
</body>
</html>

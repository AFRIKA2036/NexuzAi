name: Supabase Keep-Alive

on:
  schedule:
    # Run every 24 hours (at 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          # Pinging the health check or a public REST endpoint to trigger activity
          # Replacing the project ID with the one found in your deployment configuration
          PROJECT_ID="onanhpeqttqdruruemwr"
          URL="https://${PROJECT_ID}.supabase.co/rest/v1/"
          
          echo "Pinging Supabase Project: ${PROJECT_ID}"
          response=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 401 ]; then
            echo "Success: Supabase project is active (HTTP $response)"
          else
            echo "Warning: Received unexpected status code $response"
            exit 1
          fi

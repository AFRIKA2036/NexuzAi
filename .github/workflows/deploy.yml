name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SUPABASE_CLI_VERSION: 2.101.0
  SUPABASE_PROJECT_ID: onanhpeqttqdruruemwr

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Verify static build
        run: npm run build

  deploy:
    name: Deploy to Supabase
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.SUPABASE_AUTH_TOKEN || secrets.SUPABASE_PAT }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Validate Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing Supabase access token secret. Add it as SUPABASE_ACCESS_TOKEN, SUPABASE_TOKEN, SUPABASE_AUTH_TOKEN, or SUPABASE_PAT in this repository's GitHub Actions secrets."
            exit 1
          fi
      - name: Deploy public functions
        run: >
          supabase functions deploy
          ai-generate
          paystack-webhook
          --project-ref "$SUPABASE_PROJECT_ID"
          --no-verify-jwt
          --use-api
      - name: Deploy protected functions
        run: >
          supabase functions deploy
          admin-dashboard
          paystack-initialize
          paystack-verify
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
      - name: Deploy database migrations
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD is not set; skipping database migrations."
            exit 0
          fi

          if [ ! -d supabase/migrations ] || [ -z "$(find supabase/migrations -type f -name '*.sql' -print -quit)" ]; then
            echo "No Supabase migration files found; skipping database migrations."
            exit 0
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
